<style>
/* Hide the auto-generated title block entirely */
.title, .subtitle, .author, .date { display: none !important; }

/* Full viewport map */
#map-hero {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 9999;
  background: #0d0b12;
}
#map-hero iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* Scroll down arrow */
#scroll-hint {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10000;
  color: #c9a84c;
  font-family: Arial, sans-serif;
  font-size: 13px;
  letter-spacing: 0.1em;
  text-align: center;
  cursor: pointer;
  animation: bounce 2s infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50%       { transform: translateX(-50%) translateY(-8px); }
}

/* Content section styles */
.main-container { max-width: 960px !important; padding-top: 40px !important; margin-left: 220px !important; }
body { font-family: 'Georgia', serif; font-size: 16px; color: #2c2c2c; }
h1, h2, h3 { font-family: 'Arial', sans-serif; }
h1 { border-bottom: 3px solid #c9a84c; padding-bottom: 8px; }
h2 { border-bottom: 1px solid #ddd; padding-bottom: 6px; }
blockquote { border-left: 4px solid #c9a84c; background: #fdf9f0; padding: 12px 16px; font-style: italic; }
.callout { background: #f0eaff; border-left: 5px solid #7c3aed; padding: 14px 18px; margin: 16px 0; border-radius: 4px; }
.callout strong { color: #4c1d95; }
table { width: 100%; }
thead { background-color: #2a1f4a; color: white; }
/* Fix TOC sidebar not overlapping content */
#TOC { position: fixed; left: 0; top: 0; width: 200px; height: 100vh; overflow-y: auto; z-index: 1000; }
</style>

<!-- Full viewport map hero -->
<div id="map-hero">
  <iframe src="tarot_map_full.html" scrolling="no"></iframe>
</div>

<!-- Scroll hint -->
<div id="scroll-hint" onclick="dismissMap()">
  ▼ &nbsp; scroll down for project writeup &nbsp; ▼
</div>

<!-- Back to map button — shown after map dismissed -->
<div id="back-to-map" onclick="showMap()" style="
  display:none;
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:10000;
  background:#2a1f4a;
  color:#c9a84c;
  border:1px solid #c9a84c;
  border-radius:4px;
  padding:8px 14px;
  font-family:Arial,sans-serif;
  font-size:12px;
  letter-spacing:0.08em;
  cursor:pointer;
  box-shadow:0 2px 12px rgba(0,0,0,0.3);
">✦ &nbsp; View Map</div>

<script>
function dismissMap() {
  document.getElementById('map-hero').style.display = 'none';
  document.getElementById('scroll-hint').style.display = 'none';
  document.getElementById('back-to-map').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showMap() {
  document.getElementById('map-hero').style.display = 'block';
  document.getElementById('scroll-hint').style.display = 'block';
  document.getElementById('back-to-map').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Also dismiss when user scrolls down
window.addEventListener('scroll', function() {
  if (window.scrollY > 80) {
    document.getElementById('map-hero').style.display = 'none';
    document.getElementById('scroll-hint').style.display = 'none';
    document.getElementById('back-to-map').style.display = 'block';
  }
}, { passive: true });
</script>
